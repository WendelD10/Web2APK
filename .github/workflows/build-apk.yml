
name: Build Leia Pra Mim APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          package-manager-cache: false

      - name: Configurar Capacitor para Android
        run: npx --yes capstart init . --framework tanstack-start --app-id com.wendel.leiapramim --app-name "Leia Pra Mim" --platforms android --setup minimal --no-safe-area --yes

      - name: Gerar projeto Android
        run: npm run cap:sync

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Gerar APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Leia-Pra-Mim-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
