name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APP_URL: https://SEU-APP.lovable.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Gerar APK
        run: |
          mkdir app && cd app
          npm init -y
          npm i @capacitor/core @capacitor/android
          npm i -D @capacitor/cli
          mkdir www && echo '<html></html>' > www/index.html
          cat > capacitor.config.json <<EOF
          {"appId":"com.seunome.meuapp","appName":"MeuApp","webDir":"www","server":{"url":"$APP_URL"}}
          EOF
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
